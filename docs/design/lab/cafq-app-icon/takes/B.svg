<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C2721"/>
      <stop offset="1" stop-color="#110F0C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#FF8A3D" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caret" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFA463"/>
      <stop offset="0.5" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E8590C"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <g id="background">
    <rect width="1024" height="1024" fill="url(#bg)"/>
  </g>
  <g id="foreground">
    <!-- soft halo -->
    <circle cx="640" cy="500" r="300" fill="url(#glow)"/>
    <!-- glide trail, fading out to the left -->
    <rect x="222" y="330" width="440" height="340" rx="40" fill="url(#trail)"/>
    <!-- the caret -->
    <rect x="616" y="230" width="104" height="540" rx="34" fill="url(#caret)"/>
    <!-- sheen on the lit side -->
    <rect x="634" y="268" width="24" height="320" rx="12" fill="#FFFFFF" opacity="0.3"/>
    <!-- the status line -->
    <rect x="222" y="818" width="498" height="16" rx="8" fill="#F6F3EC" opacity="0.22"/>
  </g>
</svg>
